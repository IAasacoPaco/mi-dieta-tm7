// ============ SIMPLE RNG ============
const rng = s => { s = Math.sin(s) * 10000; return s - Math.floor(s); };

// ============ MENU GENERATOR (infinite, algorithmic) ============
function generateWeekMenu(weekSeed, excluded = []) {
  const recipes = DB.recipes.filter(r => !excluded.some(ex => r.ingredients.some(i => i.item.toLowerCase().includes(ex.toLowerCase()))));
  const cremas = recipes.filter(r => r.category === 'comida_primero' && r.vegetableHidden);
  const verdSalt = recipes.filter(r => r.category === 'comida_primero' && !r.vegetableHidden);
  const protCom = recipes.filter(r => r.category === 'comida_segundo');
  const menuComp = recipes.filter(r => r.category === 'menu_completo');
  const cenas = recipes.filter(r => r.category === 'cena');
  const ensaladas = recipes.filter(r => r.category === 'comida_completa');

  const usedRecipes = new Set();
  const pickUnique = (arr, seed) => {
    const available = arr.filter(r => !usedRecipes.has(r.id));
    const pool = available.length > 0 ? available : arr;
    if (!pool.length) return null;
    const r = pool[Math.floor(rng(seed) * pool.length)];
    if (r) usedRecipes.add(r.id);
    return r;
  };

  const desayunos = [
    'Café con leche desnatada + tostada integral con aceite de oliva',
    'Café con leche desnatada + tostada integral con jamón serrano',
    'Café con leche desnatada + tostada integral con queso fresco',
    'Café con leche desnatada + tostada integral con aceite y tomate',
    'Café con leche desnatada + tostada integral con jamón cocido',
    'Café con leche desnatada + tostada integral con mermelada sin azúcar',
    'Café con leche desnatada + tostada integral con aceite'
  ];
  const frutas = ['1 manzana','1 naranja','2 kiwis','1 pera','200g fresas','2 mandarinas','1 melocotón','3 albaricoques','200g melón','200g sandía'];

  const days = {};
  let blueFishCount = 0;

  DAYS.forEach((day, di) => {
    if (day === 'domingo') {
      days[day] = {
        desayuno: desayunos[6], almuerzo: '1 pieza de fruta',
        comida: 'LIBRE (sin pan ni dulces)', merienda: '1 pieza de fruta', cena: '1 pieza de fruta mediana'
      };
      return;
    }
    const seed = weekSeed * 100 + di * 13 + 7;
    const useMenuCompleto = di % 3 === 0 && menuComp.length > 0;
    const useSalad = di === 5 && ensaladas.length > 0;

    let comida;
    if (useMenuCompleto) {
      const mc = pickUnique(menuComp, seed + 1);
      comida = mc ? {receta: mc.id, nota: 'Menú completo Varoma: crema + proteína simultáneamente'} : {primero: pickUnique(cremas, seed + 2)?.id, segundo: pickUnique(protCom, seed + 3)?.id};
    } else if (useSalad) {
      const ens = pickUnique(ensaladas, seed + 1);
      comida = ens ? {receta: ens.id} : {primero: pickUnique(cremas, seed + 2)?.id, segundo: pickUnique(protCom, seed + 3)?.id};
    } else {
      const useCrema = rng(seed + 10) > 0.3;
      const primo = useCrema ? pickUnique(cremas, seed + 2) : pickUnique(verdSalt, seed + 2);
      comida = {primero: primo?.id, segundo: pickUnique(protCom, seed + 3)?.id};
    }

    let cenaR;
    const needBlueFish = blueFishCount < 2 && di >= 3;
    if (needBlueFish) {
      const bluefish = cenas.filter(r => r.tags?.some(t => t.includes('salmón') || t.includes('omega') || t.includes('pescado azul')));
      cenaR = pickUnique(bluefish.length ? bluefish : cenas, seed + 5);
    } else {
      cenaR = pickUnique(cenas, seed + 5);
    }
    if (cenaR?.tags?.some(t => t.includes('salmón') || t.includes('omega') || t.includes('pescado azul'))) blueFishCount++;
    const verdAcomp = pickUnique(verdSalt.length ? verdSalt : cremas, seed + 6);

    days[day] = {
      desayuno: desayunos[di % desayunos.length],
      almuerzo: frutas[Math.floor(rng(seed + 20) * frutas.length)],
      comida,
      merienda: frutas[Math.floor(rng(seed + 30) * frutas.length)],
      cena: {receta: cenaR?.id, acompanamiento: verdAcomp?.id}
    };
  });
  return days;
}

// ============ SHOPPING LIST GENERATOR ============
function generateShoppingList(menu, filterType, filterValue) {
  const items = {};
  const daysToInclude = filterType === 'day' ? [filterValue] : DAYS;

  daysToInclude.forEach(day => {
    const d = menu[day];
    if (!d || typeof d.comida === 'string') return;
    const ids = [];
    ['comida','cena'].forEach(meal => {
      const m = d[meal];
      if (!m || typeof m === 'string') return;
      if (m.receta) ids.push(m.receta);
      if (m.primero) ids.push(m.primero);
      if (m.segundo) ids.push(m.segundo);
      if (m.acompanamiento) ids.push(m.acompanamiento);
    });
    ids.forEach(id => {
      const r = R(id);
      if (r) r.ingredients.forEach(ing => {
        const k = ing.item.toLowerCase();
        if (!items[k]) items[k] = {name: ing.item, qty: [], days: new Set(), recipes: new Set()};
        items[k].qty.push(ing.quantity);
        items[k].days.add(day);
        items[k].recipes.add(r.name);
      });
    });
  });

  const pW = ['pollo','pavo','ternera','cerdo','solomillo','lomo','entrecot','merluza','salmón','lubina','bacalao','gambas','langostinos','mejillones','sepia','calamares','huevo','atún','pulpo','jamón','carne'];
  const vW = ['calabacín','brócoli','espárrago','champiñón','seta','pimiento','berenjena','calabaza','coliflor','espinaca','puerro','tomate','lechuga','pepino','cebolla','ajo','alcachofa','judía'];
  const cW = ['aceite','vinagre','limón','sal','pimienta','pimentón','curry','comino','nuez moscada','tomillo','hierbas','orégano','albahaca','jengibre','guindilla','soja','mostaza','perejil','eneldo','laurel'];
  const cats = {'🥩 Proteínas':[], '🥬 Verduras':[], '🧂 Condimentos':[], '📦 Otros':[]};
  Object.values(items).forEach(it => {
    const n = it.name.toLowerCase();
    it.days = Array.from(it.days); it.recipes = Array.from(it.recipes);
    if (pW.some(w => n.includes(w))) cats['🥩 Proteínas'].push(it);
    else if (vW.some(w => n.includes(w))) cats['🥬 Verduras'].push(it);
    else if (cW.some(w => n.includes(w))) cats['🧂 Condimentos'].push(it);
    else cats['📦 Otros'].push(it);
  });
  return cats;
}

const CHEF_FLAVORS = [
  {name:'Mediterráneo', spices:'orégano, tomillo y romero', season:'sal, pimienta y orégano', arom:'2 ramitas de tomillo y 1 laurel', top:'un chorrito de aceite de oliva virgen extra', suf:'al estilo mediterráneo'},
  {name:'Asiático', spices:'1 cda jengibre rallado y un chorrito de soja', season:'jengibre, soja y sésamo', arom:'rodajas de jengibre y soja', top:'semillas de sésamo tostadas', suf:'estilo asiático'},
  {name:'Ahumado', spices:'1 cda pimentón ahumado de la Vera', season:'pimentón ahumado, sal y ajo en polvo', arom:'1 cda pimentón ahumado en el agua', top:'un toque de pimentón', suf:'con pimentón ahumado'},
  {name:'Picante', spices:'½ guindilla y 1 cda de curry', season:'curry, comino y cayena', arom:'1 guindilla seca y comino', top:'guindilla fresca picada', suf:'al toque picante'},
  {name:'Hierbas frescas', spices:'albahaca, perejil y eneldo frescos', season:'hierbas provenzales y zumo de limón', arom:'bouquet garni (perejil, tomillo, laurel)', top:'hierbas frescas picadas y limón', suf:'con hierbas frescas'},
  {name:'Ajo y limón', spices:'3 dientes de ajo confitados y zumo de ½ limón', season:'ajo en polvo, limón y perejil', arom:'3 dientes de ajo y cáscara de limón', top:'perejil y ralladura de limón', suf:'al ajillo con limón'}
];

function buildRecipe(method, vegIdx, protIdx, flavIdx) {
  const v = CHEF_VEGS[vegIdx];
  const p = CHEF_PROTS[protIdx];
  const f = CHEF_FLAVORS[flavIdx];
  let name, steps, time, cal;

  if (method === 'crema') {
    name = 'Crema de ' + v.name.toLowerCase() + ' ' + f.suf;
    steps = [
      'Pon 20g de aceite de oliva en el vaso. Programa 3 min / 120°C / vel 1.',
      'Añade 1 cebolla mediana troceada. Programa 5 min / 120°C / vel 2.',
      'Añade ' + v.prep + ' y 500g de caldo de verduras.',
      'Programa 20 min / 100°C / vel 2.',
      'Añade ' + f.spices + ', sal y pimienta. Tritura 1 min / vel progresiva 5-7-10.',
      'Rectifica de sal. Sirve con ' + f.top + '.'
    ];
    time = 30; cal = 85;
  } else if (method === 'salteado') {
    name = v.name + ' salteado ' + f.suf;
    steps = [
      'Pon 15g de aceite de oliva en el vaso. Programa 3 min / 160°C / vel 1.',
      'Añade 2 dientes de ajo laminados. Programa 2 min / 160°C / giro inverso / vel 1.',
      'Añade ' + v.prep + '. Programa 10 min / 160°C / giro inverso / vel 1.',
      'Añade ' + f.spices + ', sal y pimienta. Mezcla 30 seg / vel 2.',
      'Sirve inmediatamente con ' + f.top + '.'
    ];
    time = 18; cal = 95;
  } else if (method === 'varoma') {
    name = p.name + ' al Varoma ' + f.suf;
    steps = [
      'Pon 800g de agua en el vaso con ' + f.arom + '.',
      'Coloca ' + p.prep + ' en la bandeja Varoma, sazonado con ' + f.season + '.',
      'Tapa con la tapa del Varoma. Programa ' + p.time + ' min / Varoma / vel 1.',
      'Retira con cuidado. Sirve con ' + f.top + '.'
    ];
    time = p.time + 5; cal = 170;
  } else {
    name = p.name + ' dorada ' + f.suf;
    steps = [
      'Pon 15g de aceite de oliva en el vaso. Programa 3 min / 160°C / vel 1.',
      'Añade ' + p.prep + ' sazonado con ' + f.season + '.',
      'Programa ' + p.time + ' min / 160°C / giro inverso / vel 1.',
      'Sirve con ' + f.top + '.'
    ];
    time = p.time + 5; cal = 210;
  }
  return {name, steps, time, cal, method, veg: v?.name, prot: p?.name, flavor: f.name};
}

// ============ MEAL CARD ============
function MealCard({meal, data, showR}) {
  if (!data) return null;
  const info = MEAL_INFO[meal];
  let content;
  if (typeof data === 'string') content = <p className="text-sm text-gray-700">{data}</p>;
  else if (data.receta) {
    const r = R(data.receta); const a = data.acompanamiento ? R(data.acompanamiento) : null;
    content = <div>
      {r && <button onClick={() => showR(r.id)} className="text-sm font-medium text-emerald-700 hover:underline text-left block">{r.name} <span className="text-xs text-gray-400">({r.totalTime}min)</span></button>}
      {a && <button onClick={() => showR(a.id)} className="text-xs text-blue-600 hover:underline mt-1 block">+ {a.name}</button>}
      {data.nota && <p className="text-xs text-amber-600 mt-1">💡 {data.nota}</p>}
    </div>;
  } else if (data.primero || data.segundo) {
    const p = data.primero ? R(data.primero) : null;
    const s = data.segundo ? R(data.segundo) : null;
    content = <div>
      {p && <button onClick={() => showR(p.id)} className="text-sm font-medium text-emerald-700 hover:underline block text-left">1º {p.name} <span className="text-xs text-gray-400">({p.totalTime}min)</span></button>}

      {p && s && <p className="text-xs text-amber-600 mt-1">💡 Se pueden hacer juntos: crema abajo, proteína arriba en Varoma</p>}
    </div>;
  }
  return (
    <div className="bg-white rounded-xl shadow-sm p-3 ml" style={{borderLeftColor: info.color}}>
      <div className="flex items-start gap-2"><span>{info.emoji}</span><div className="flex-1">
        <div className="text-xs font-bold uppercase tracking-wide" style={{color: info.color}}>{info.label}</div>{content}
      </div></div>
    </div>
  );
}

  const [flavIdx, setFlavIdx] = useState(0);
  const [generated, setGenerated] = useState(null);
  const [saved, setSaved] = useState(() => {
    try { return JSON.parse(localStorage.getItem('dietaSavedRecipes') || '[]'); } catch(e) { return []; }
  });
  const [excInput, setExcInput] = useState('');

  useEffect(() => { try { localStorage.setItem('dietaSavedRecipes', JSON.stringify(saved)); } catch(e) {} }, [saved]);

  const doGenerate = () => {
    const r = buildRecipe(method, vegIdx, protIdx, flavIdx);
    setGenerated(r);
  };

  const doRandom = () => {
    const seed = Date.now();
    const mi = Math.floor(rng(seed) * CHEF_METHODS.length);
    const vi = Math.floor(rng(seed + 1) * CHEF_VEGS.length);
    const pi = Math.floor(rng(seed + 2) * CHEF_PROTS.length);
    const fi = Math.floor(rng(seed + 3) * CHEF_FLAVORS.length);
    const m = CHEF_METHODS[mi].id;
    setMethod(m); setVegIdx(vi); setProtIdx(pi); setFlavIdx(fi);
    const r = buildRecipe(m, vi, pi, fi);
    setGenerated(r);
  };

  const doRemix = () => {
    const seed = Date.now();
    const vi = Math.floor(rng(seed) * CHEF_VEGS.length);
    const fi = Math.floor(rng(seed + 1) * CHEF_FLAVORS.length);
    setVegIdx(vi); setFlavIdx(fi);
    const r = buildRecipe(method, vi, protIdx, fi);
    setGenerated(r);
  };

  const saveRecipe = () => {
    if (generated && !saved.some(s => s.name === generated.name)) {
      setSaved([...saved, generated]);
    }
  };

  return (
    <div className="space-y-3">
      <div className="bg-gradient-to-r from-amber-700 to-orange-800 rounded-xl p-4">
        <h2 className="font-bold text-lg text-amber-100">👨‍🍳 Chef TM7</h2>
        <p className="text-sm text-amber-200">Crea recetas nuevas para tu Thermomix siguiendo las reglas de tu dieta. 100% gratuito.</p>
      </div>

      <div className="flex gap-2 overflow-x-auto no-sb">
        {[['crear','🍳 Crear'],['sorpresa','🎲 Sorpresa'],['guardadas','💾 Guardadas'],['excluidos','🚫 Excluidos']].map(([id,lb]) =>
          <button key={id} onClick={() => setMode(id)} className={`pill ${mode === id ? 'pill-on' : 'pill-off'}`}>{lb}</button>
        )}
      </div>

      {mode === 'crear' && (
        <div className="space-y-3 fi">
          <div className="bg-white rounded-xl shadow-sm p-4 space-y-3">
            <h3 className="font-bold text-gray-800">Elige los ingredientes:</h3>
            <div>
              <label className="text-xs font-bold text-gray-500 uppercase">Método de cocción</label>
              <div className="grid grid-cols-2 gap-2 mt-1">
                {CHEF_METHODS.map(m =>
                  <button key={m.id} onClick={() => setMethod(m.id)} className={`text-left p-2 rounded-lg border text-sm ${method === m.id ? 'border-emerald-500 bg-emerald-50' : 'border-gray-200'}`}>
                    <span className="text-lg">{m.icon}</span> <strong>{m.name}</strong>
                    <div className="text-xs text-gray-400">{m.desc}</div>
                  </button>
                )}
              </div>
            </div>
            {(method === 'crema' || method === 'salteado') && (
              <div>
                <label className="text-xs font-bold text-gray-500 uppercase">Verdura principal</label>
                <select className="sel mt-1" value={vegIdx} onChange={e => setVegIdx(Number(e.target.value))}>
                  {CHEF_VEGS.map((v, i) => <option key={i} value={i}>{v.name}</option>)}
                </select>
              </div>
            )}
            {(method === 'varoma' || method === 'dorado') && (
              <div>
                <label className="text-xs font-bold text-gray-500 uppercase">Proteína</label>
                <select className="sel mt-1" value={protIdx} onChange={e => setProtIdx(Number(e.target.value))}>
                  {CHEF_PROTS.map((p, i) => <option key={i} value={i}>{p.name}</option>)}
                </select>
              </div>
            )}
            <div>
              <label className="text-xs font-bold text-gray-500 uppercase">Perfil de sabor</label>
              <select className="sel mt-1" value={flavIdx} onChange={e => setFlavIdx(Number(e.target.value))}>
                {CHEF_FLAVORS.map((f, i) => <option key={i} value={i}>{f.name}</option>)}
              </select>
            </div>
            <div className="flex gap-2">
              <button onClick={doGenerate} className="flex-1 bg-emerald-800 text-emerald-100 py-3 rounded-xl font-medium text-sm">🍳 Generar receta</button>
              <button onClick={doRemix} className="px-4 bg-amber-700 text-amber-100 py-3 rounded-xl font-medium text-sm">🔄</button>
            </div>
          </div>

          {generated && <GeneratedCard recipe={generated} onSave={saveRecipe} saved={saved}/>}
        </div>
      )}

      {mode === 'sorpresa' && (
        <div className="space-y-3 fi">
          <div className="bg-white rounded-xl shadow-sm p-4 text-center">
            <div className="text-4xl mb-2">🎲</div>
            <p className="text-sm text-gray-600 mb-4">Pulsa el botón y te creo una receta aleatoria compatible con tu dieta y tu Thermomix TM7.</p>
            <button onClick={doRandom} className="w-full bg-gradient-to-r from-amber-700 to-orange-800 text-amber-100 py-3 rounded-xl font-bold text-sm shadow-md">
              🎲 ¡Sorpréndeme!
            </button>
          </div>
          {generated && <GeneratedCard recipe={generated} onSave={saveRecipe} saved={saved}/>}
        </div>
      )}

      {mode === 'guardadas' && (
        <div className="space-y-2 fi">
          {saved.length === 0 ? (
            <div className="bg-white rounded-xl shadow-sm p-6 text-center">
              <div className="text-3xl mb-2">📭</div>
              <p className="text-sm text-gray-500">No tienes recetas guardadas. Crea una en "Crear" o "Sorpresa" y pulsa "Guardar".</p>
            </div>
          ) : saved.map((r, i) => (
            <div key={i} className="bg-white rounded-xl shadow-sm p-3">
              <div className="flex justify-between items-start">
                <div>
                  <h4 className="font-bold text-sm text-gray-800">{r.name}</h4>
                  <div className="flex gap-1 mt-1">
                    <span className="bd bg-blue-100 text-blue-700">⏱{r.time}min</span>
                    <span className="bd bg-orange-100 text-orange-700">🔥{r.cal}kcal</span>
                  </div>
                </div>
                <button onClick={() => setSaved(saved.filter((_, j) => j !== i))} className="text-red-400 text-xs">✕ Borrar</button>
              </div>
              <ol className="mt-2 space-y-1">{r.steps.map((s, si) =>
                <li key={si} className="text-xs text-gray-600 flex gap-2">
                  <span className="bg-emerald-100 text-emerald-700 rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold flex-shrink-0">{si + 1}</span>
                  {s}
                </li>
              )}</ol>
              {r.name && <a href={cookidooSearch(r.name)} target="_blank" rel="noopener noreferrer" className="text-xs text-emerald-600 mt-2 block">🔍 Buscar similar en Cookidoo</a>}
            </div>
          ))}
        </div>
      )}

      {mode === 'excluidos' && (
        <div className="space-y-3 fi">
          <div className="bg-white rounded-xl shadow-sm p-4">
            <h3 className="font-bold text-gray-800 mb-2">🚫 Alimentos excluidos</h3>
            <p className="text-xs text-gray-500 mb-3">Los menús semanales evitarán recetas con estos alimentos.</p>
            <div className="flex flex-wrap gap-1 mb-3">
              {excluded.length === 0 && <span className="text-xs text-gray-400">Ninguno por ahora</span>}
              {excluded.map((ex, i) => <span key={i} className="bd bg-red-100 text-red-700 cursor-pointer" onClick={() => setExcluded(excluded.filter((_, j) => j !== i))}>{ex} ✕</span>)}
            </div>
            <div className="flex gap-2">
              <input type="text" value={excInput} onChange={e => setExcInput(e.target.value)} placeholder="Ej: brócoli, gambas..." className="flex-1 p-2 rounded-lg border text-sm"/>
              <button onClick={() => { if (excInput.trim()) { setExcluded([...excluded, excInput.trim()]); setExcInput(''); } }} className="pill pill-on">Añadir</button>
            </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm p-4">
            <h3 className="font-bold text-gray-800 mb-2">📋 Reglas de la dieta</h3>
            {Object.entries(DB.dietRules.meals).map(([k, m]) =>
              <div key={k} className="mb-3 ml p-2" style={{borderLeftColor: MEAL_INFO[k]?.color || '#ccc'}}>
                <div className="flex items-center gap-1"><span>{MEAL_INFO[k]?.emoji}</span><strong className="text-sm capitalize" style={{color: MEAL_INFO[k]?.color}}>{k}</strong><span className="text-xs text-gray-400">{m.timeRange}</span></div>
                <p className="text-xs text-gray-600 mt-1">{m.rules}</p>
                {m.thermomixTip && <p className="text-xs text-emerald-600 bg-emerald-50 p-1 rounded mt-1">🍳 {m.thermomixTip}</p>}
              </div>
            )}
            <div className="bg-red-50 rounded-lg p-2 mt-2">
              <p className="text-xs font-bold text-red-700">🚫 Prohibido: {DB.dietRules.prohibited.join(', ')}</p>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============ GENERATED RECIPE CARD ============
function GeneratedCard({recipe, onSave, saved}) {
  const isSaved = saved.some(s => s.name === recipe.name);
  return (
    <div className="bg-white rounded-xl shadow p-4 fi2 border-l-4 border-emerald-500">
      <h3 className="font-bold text-gray-800 mb-1">{recipe.name}</h3>
      <div className="flex gap-1 mb-3">
        <span className="bd bg-blue-100 text-blue-700">⏱{recipe.time}min</span>
        <span className="bd bg-orange-100 text-orange-700">🔥~{recipe.cal}kcal</span>
        <span className="bd bg-gray-800 text-white">TM7</span>
      </div>
      <h4 className="text-xs font-bold text-gray-500 uppercase mb-1">Pasos Thermomix TM7:</h4>
      <ol className="space-y-2 mb-3">{recipe.steps.map((s, i) =>
        <li key={i} className="flex gap-2 text-sm">
          <span className="bg-emerald-800 text-emerald-100 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold flex-shrink-0">{i + 1}</span>
          <span className="text-gray-700">{s}</span>
        </li>
      )}</ol>
      <div className="flex gap-2">
        <button onClick={onSave} disabled={isSaved} className={`flex-1 py-2 rounded-xl text-sm font-medium ${isSaved ? 'bg-gray-200 text-gray-400' : 'bg-emerald-800 text-emerald-100'}`}>
          {isSaved ? '✓ Guardada' : '💾 Guardar receta'}
        </button>
        <a href={cookidooSearch(recipe.name)} target="_blank" rel="noopener noreferrer"
          className="px-4 py-2 rounded-xl text-sm font-medium bg-blue-800 text-blue-100">
          Cookidoo
        </a>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
