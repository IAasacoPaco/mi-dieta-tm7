<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

// ==================== UTILITY FUNCTIONS ====================
const dayNames = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
const dayLabels = ['Dom','Lun','Mar','Mie','Jue','Vie','Sab'];
const dayFull = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

function getTodayIndex() { return new Date().getDay(); }
function getTodayName() { return dayNames[getTodayIndex()]; }

function getRecipeById(id) {
  return DB.recipes.find(r => r.id === id);
}

function getCookidooUrl(terms) {
  if (!terms || terms.length === 0) return null;
  return `https://cookidoo.es/search/es-ES?query=${encodeURIComponent(terms[0])}&context=recipes`;
}

const catEmoji = {
  'comida_primero': '🥣', 'comida_segundo': '🥩', 'cena': '🐟',
  'menu_completo': '⭐', 'comida_completa': '🥗', 'salsa': '🫙', 'base': '🥚'
};

const mealColors = {
  desayuno: '#f59e0b', almuerzo: '#8b5cf6', comida: '#059669',
  merienda: '#ec4899', cena: '#3b82f6'
};

const mealEmoji = {
  desayuno: '☀️', almuerzo: '🍎', comida: '🍽️', merienda: '🍊', cena: '🌙'
};

const difficultyColor = {
  'muy fácil': 'bg-green-100 text-green-800',
  'fácil': 'bg-blue-100 text-blue-800',
  'media': 'bg-yellow-100 text-yellow-800'
};

// ==================== COMPONENTS ====================

function App() {
  const [tab, setTab] = useState('inicio');
  const [selectedWeek, setSelectedWeek] = useState(0);
  const [selectedRecipe, setSelectedRecipe] = useState(null);
  const [searchText, setSearchText] = useState('');
  const [filterCat, setFilterCat] = useState('all');
  const [excludedFoods, setExcludedFoods] = useState([]);
  const [shoppingChecked, setShoppingChecked] = useState({});
  const [selectedDay, setSelectedDay] = useState(getTodayName());

  const showRecipe = useCallback((id) => {
    const r = getRecipeById(id);
    if (r) { setSelectedRecipe(r); setTab('receta_detail'); }
  }, []);

  if (tab === 'receta_detail' && selectedRecipe) {
    return <RecipeDetail recipe={selectedRecipe} onBack={() => setTab('recetas')} />;
  }

  return (
    <div className="min-h-screen pb-20">
      <header className="bg-gradient-to-r from-green-600 to-emerald-700 text-white p-4 shadow-lg sticky top-0 z-50">
        <div className="max-w-lg mx-auto flex items-center justify-between">
          <div>
            <h1 className="text-lg font-bold">Mi Dieta TM7</h1>
            <p className="text-xs text-green-200">Cronobiología + Thermomix</p>
          </div>
          <div className="text-2xl">🍳</div>
        </div>
      </header>

      <main className="max-w-lg mx-auto p-4 fade-in">
        {tab === 'inicio' && <HomeTab onShowRecipe={showRecipe} selectedWeek={selectedWeek} />}
        {tab === 'plan' && <PlanTab selectedWeek={selectedWeek} setSelectedWeek={setSelectedWeek} selectedDay={selectedDay} setSelectedDay={setSelectedDay} onShowRecipe={showRecipe} />}
        {tab === 'recetas' && <RecipesTab searchText={searchText} setSearchText={setSearchText} filterCat={filterCat} setFilterCat={setFilterCat} onShowRecipe={showRecipe} excludedFoods={excludedFoods} />}
        {tab === 'compra' && <ShoppingTab selectedWeek={selectedWeek} setSelectedWeek={setSelectedWeek} checked={shoppingChecked} setChecked={setShoppingChecked} />}
        {tab === 'reglas' && <RulesTab />}
      </main>

      <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-50">
        <div className="max-w-lg mx-auto flex justify-around">
          {[
            ['inicio', '🏠', 'Inicio'],
            ['plan', '📅', 'Plan'],
            ['recetas', '📖', 'Recetas'],
            ['compra', '🛒', 'Compra'],
            ['reglas', '📋', 'Reglas']
          ].map(([id, icon, label]) => (
            <button key={id} onClick={() => setTab(id)}
              className={`flex flex-col items-center py-2 px-3 text-xs ${tab === id ? 'tab-active' : 'tab-inactive'}`}>
              <span className="text-xl">{icon}</span>
              <span>{label}</span>
            </button>
          ))}
        </div>
      </nav>
    </div>
  );
}

// ==================== HOME TAB ====================
function HomeTab({ onShowRecipe, selectedWeek }) {
  const today = getTodayName();
  const todayFull = dayFull[getTodayIndex()];
  const week = DB.weeklyTemplates[selectedWeek];
  const todayPlan = week?.days[today];

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-2xl shadow-md p-5">
        <div className="flex items-center justify-between mb-3">
          <div>
            <h2 className="text-xl font-bold text-gray-800">Hola! 💪</h2>
            <p className="text-sm text-gray-500">{todayFull}, {new Date().toLocaleDateString('es-ES', {day: 'numeric', month: 'long'})}</p>
          </div>
          <div className="bg-emerald-100 rounded-xl p-3 text-center">
            <div className="text-2xl font-bold text-emerald-700">98</div>
            <div className="text-xs text-emerald-600">kg</div>
          </div>
        </div>
        <div className="grid grid-cols-3 gap-2 mt-3">
          <div className="bg-blue-50 rounded-lg p-2 text-center">
            <div className="text-lg font-bold text-blue-700">52</div>
            <div className="text-xs text-blue-500">años</div>
          </div>
          <div className="bg-purple-50 rounded-lg p-2 text-center">
            <div className="text-lg font-bold text-purple-700">55</div>
            <div className="text-xs text-purple-500">recetas</div>
          </div>
          <div className="bg-orange-50 rounded-lg p-2 text-center">
            <div className="text-lg font-bold text-orange-700">24</div>
            <div className="text-xs text-orange-500">min/media</div>
          </div>
        </div>
      </div>

      <div className="bg-gradient-to-r from-emerald-500 to-green-600 rounded-2xl shadow-md p-4 text-white">
        <p className="text-sm font-medium">Recuerda: las verduras en cremas con especias son otro mundo. Nada de verduras cocidas sosas. 🌶️</p>
      </div>

      {todayPlan && today !== 'domingo' ? (
        <div className="space-y-2">
          <h3 className="font-bold text-gray-700 text-lg">Hoy comes:</h3>
          <MealCard meal="desayuno" data={todayPlan.desayuno} onShowRecipe={onShowRecipe} />
          <MealCard meal="almuerzo" data={todayPlan.almuerzo} onShowRecipe={onShowRecipe} />
          <MealCard meal="comida" data={todayPlan.comida} onShowRecipe={onShowRecipe} />
          <MealCard meal="merienda" data={todayPlan.merienda} onShowRecipe={onShowRecipe} />
          <MealCard meal="cena" data={todayPlan.cena} onShowRecipe={onShowRecipe} />
        </div>
      ) : (
        <div className="bg-white rounded-2xl shadow-md p-5 text-center">
          <div className="text-4xl mb-2">🎉</div>
          <h3 className="font-bold text-lg">Domingo: Comida Libre</h3>
          <p className="text-sm text-gray-500">Sin pan ni dulces. Disfruta.</p>
        </div>
      )}
    </div>
  );
}

function MealCard({ meal, data, onShowRecipe }) {
  if (!data) return null;
  const color = mealColors[meal];
  const emoji = mealEmoji[meal];
  const label = meal.charAt(0).toUpperCase() + meal.slice(1);

  let content = null;
  let recipeIds = [];

  if (typeof data === 'string') {
    content = <p className="text-sm text-gray-700">{data}</p>;
  } else if (data.receta) {
    const r = getRecipeById(data.receta);
    if (r) {
      recipeIds.push(r.id);
      content = (
        <div>
          <button onClick={() => onShowRecipe(r.id)} className="text-sm font-medium text-emerald-700 hover:underline text-left">
            {r.name} <span className="text-xs text-gray-400">({r.totalTime} min)</span>
          </button>
          {data.acompañamiento && (() => {
            const a = getRecipeById(data.acompañamiento);
            return a ? <button onClick={() => onShowRecipe(a.id)} className="block text-xs text-blue-600 hover:underline mt-1">+ {a.name}</button> : null;
          })()}
          {data.nota && <p className="text-xs text-amber-600 mt-1">💡 {data.nota}</p>}
        </div>
      );
    }
  } else if (data.primero || data.segundo) {
    content = (
      <div>
        {data.primero && (() => {
          const r = getRecipeById(data.primero);
          return r ? <button onClick={() => onShowRecipe(r.id)} className="text-sm font-medium text-emerald-700 hover:underline block text-left">1º {r.name} <span className="text-xs text-gray-400">({r.totalTime} min)</span></button> : <p className="text-sm text-gray-600">1º {data.primero}</p>;
        })()}
        {data.segundo && (() => {
          const r = getRecipeById(data.segundo);
          return r ? <button onClick={() => onShowRecipe(r.id)} className="text-sm font-medium text-emerald-700 hover:underline block text-left mt-1">2º {r.name} <span className="text-xs text-gray-400">({r.totalTime} min)</span></button> : <p className="text-sm text-gray-600 mt-1">2º {data.segundo}</p>;
        })()}
        {data.nota && <p className="text-xs text-amber-600 mt-1">💡 {data.nota}</p>}
      </div>
    );
  }

  return (
    <div className="bg-white rounded-xl shadow-sm p-3 meal-card" style={{borderLeftColor: color}}>
      <div className="flex items-start gap-2">
        <span className="text-lg">{emoji}</span>
        <div className="flex-1">
          <div className="text-xs font-bold uppercase tracking-wide" style={{color}}>{label}</div>
          {content}
        </div>
      </div>
    </div>
  );
}

// ==================== PLAN TAB ====================
function PlanTab({ selectedWeek, setSelectedWeek, selectedDay, setSelectedDay, onShowRecipe }) {
  const week = DB.weeklyTemplates[selectedWeek];
  const todayName = getTodayName();
  const plan = week?.days[selectedDay];

  return (
    <div className="space-y-4">
      <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2">
        {DB.weeklyTemplates.map((w, i) => (
          <button key={i} onClick={() => setSelectedWeek(i)}
            className={`px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap ${selectedWeek === i ? 'bg-emerald-600 text-white' : 'bg-white text-gray-600 shadow-sm'}`}>

            className={`py-2 rounded-lg text-xs font-medium text-center

          <MealCard meal="comida" data={plan.comida} onShowRecipe={onShowRecipe} />
          <MealCard meal="merienda" data={plan.merienda} onShowRecipe={onShowRecipe} />
          <MealCard meal="cena" data={plan.cena} onShowRecipe={onShowRecipe} />

      )}

  );
}

// ==================== RECIPES TAB ====================
function RecipesTab({ searchText, setSearchText, filterCat, setFilterCat, onShowRecipe, excludedFoods }) {
  const categories = [
    ['all', 'Todas'],
    ['comida_primero', '🥣 Cremas/Verduras'],
    ['comida_segundo', '🥩 Proteína Comida'],
    ['cena', '🐟 Cena'],
    ['menu_completo', '⭐ Menú Completo'],
    ['comida_completa', '🥗 Ensaladas'],
    ['salsa', '🫙 Salsas']
  ];

  const filtered = useMemo(() => {
    return DB.recipes.filter(r => {
      if (filterCat !== 'all' && r.category !== filterCat) return false;
      if (searchText) {
        const s = searchText.toLowerCase();
        return r.name.toLowerCase().includes(s) || r.tags.some(t => t.includes(s));
      }
      return true;
    });
  }, [searchText, filterCat]);

  return (
    <div className="space-y-3">
      <input type="text" value={searchText} onChange={e => setSearchText(e.target.value)}
        placeholder="Buscar receta..." className="w-full p-3 rounded-xl border border-gray-200 bg-white shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400" />

      <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
        {categories.map(([id, label]) => (
          <button key={id} onClick={() => setFilterCat(id)}
            className={`px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap ${filterCat === id ? 'bg-emerald-600 text-white' : 'bg-white text-gray-600 shadow-sm'}`}>
            {label}
          </button>
        ))}
      </div>

      <p className="text-xs text-gray-400">{filtered.length} recetas</p>

      <div className="space-y-2">
        {filtered.map(r => (
          <button key={r.id} onClick={() => onShowRecipe(r.id)}
            className="w-full text-left bg-white rounded-xl shadow-sm p-4 recipe-card">
            <div className="flex items-start justify-between">
              <div className="flex-1">
                <div className="flex items-center gap-2 mb-1">
                  <span>{catEmoji[r.category] || '🍴'}</span>
                  <h4 className="font-bold text-sm text-gray-800">{r.name}</h4>
                </div>
                <div className="flex flex-wrap gap-1 mt-1">
                  <span className={`badge ${difficultyColor[r.difficulty] || 'bg-gray-100 text-gray-600'}`}>{r.difficulty}</span>
                  <span className="badge bg-gray-100 text-gray-600">⏱ {r.totalTime} min</span>
                  <span className="badge bg-gray-100 text-gray-600">🔥 {r.calories_approx} kcal</span>
                  {r.vegetableHidden && <span className="badge bg-green-100 text-green-700">🥦 Verdura escondida</span>}
                  {r.category === 'menu_completo' && <span className="badge bg-amber-100 text-amber-700">⭐ 2 platos en 1</span>}
                </div>
              </div>
              <span className="text-gray-300 text-lg ml-2">›</span>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

// ==================== SHOPPING TAB ====================
function ShoppingTab({ selectedWeek, setSelectedWeek, checked, setChecked }) {
  const week = DB.weeklyTemplates[selectedWeek];

  const shoppingList = useMemo(() => {
    const items = {};
    if (!week) return {};

    Object.values(week.days).forEach(day => {
      if (typeof day === 'string') return;
      ['comida', 'cena'].forEach(meal => {
        const m = day[meal];
        if (!m || typeof m === 'string') return;

        const recipeIds = [];
        if (m.receta) recipeIds.push(m.receta);
        if (m.primero) recipeIds.push(m.primero);
        if (m.segundo) recipeIds.push(m.segundo);
        if (m.acompañamiento) recipeIds.push(m.acompañamiento);

        recipeIds.forEach(id => {
          const r = getRecipeById(id);
          if (r) {
            r.ingredients.forEach(ing => {
              const key = ing.item.toLowerCase();
              if (!items[key]) items[key] = { name: ing.item, quantities: [] };
              items[key].quantities.push(ing.quantity);
            });
          }
        });
      });
    });

    // Categorize
    const cats = { 'Proteínas 🥩': [], 'Verduras 🥬': [], 'Frutas 🍎': [], 'Condimentos 🧂': [], 'Otros 📦': [] };
    const proteinWords = ['pollo','pavo','ternera','cerdo','solomillo','lomo','entrecot','merluza','salmón','lubina','bacalao','gambas','langostinos','mejillones','sepia','calamares','huevo','atún','pulpo','jamón','carne'];
    const vegWords = ['calabacín','brócoli','espárrago','champiñón','seta','pimiento','berenjena','calabaza','coliflor','espinaca','puerro','tomate','lechuga','pepino','cebolla','ajo','alcachofa','judía','borraja','acelga','cogollo','endivia'];
    const condWords = ['aceite','vinagre','limón','sal','pimienta','pimentón','curry','comino','nuez moscada','tomillo','hierbas','orégano','albahaca','jengibre','guindilla','soja','mostaza','perejil','eneldo','laurel'];

    Object.values(items).forEach(item => {
      const n = item.name.toLowerCase();
      if (proteinWords.some(w => n.includes(w))) cats['Proteínas 🥩'].push(item);
      else if (vegWords.some(w => n.includes(w))) cats['Verduras 🥬'].push(item);
      else if (condWords.some(w => n.includes(w))) cats['Condimentos 🧂'].push(item);
      else cats['Otros 📦'].push(item);
    });

    return cats;
  }, [selectedWeek]);

  const toggleCheck = (name) => {
    setChecked(prev => ({ ...prev, [name]: !prev[name] }));
  };

  const totalItems = Object.values(shoppingList).flat().length;
  const checkedCount = Object.values(checked).filter(Boolean).length;

  return (
    <div className="space-y-4">
      <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2">
        {DB.weeklyTemplates.map((w, i) => (
          <button key={i} onClick={() => { setSelectedWeek(i); setChecked({}); }}
            className={`px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap ${selectedWeek === i ? 'bg-emerald-600 text-white' : 'bg-white text-gray-600 shadow-sm'}`}>
            Semana {w.weekNumber}
          </button>
        ))}
      </div>

      <div className="bg-white rounded-xl shadow-sm p-3">
        <div className="flex justify-between items-center">
          <span className="text-sm text-gray-600">Progreso</span>
          <span className="text-sm font-bold text-emerald-700">{checkedCount}/{totalItems}</span>
        </div>
        <div className="w-full bg-gray-200 rounded-full h-2 mt-2">
          <div className="bg-emerald-500 h-2 rounded-full transition-all" style={{width: `${totalItems ? (checkedCount/totalItems*100) : 0}%`}}></div>
        </div>
      </div>

      {Object.entries(shoppingList).map(([cat, items]) => items.length > 0 && (
        <div key={cat} className="bg-white rounded-xl shadow-sm p-4">
          <h3 className="font-bold text-gray-800 mb-2">{cat}</h3>
          <div className="space-y-2">
            {items.map((item, i) => (
              <label key={i} className="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" checked={!!checked[item.name]} onChange={() => toggleCheck(item.name)}
                  className="w-5 h-5 text-emerald-600 rounded" />
                <span className={`text-sm ${checked[item.name] ? 'line-through text-gray-400' : 'text-gray-700'}`}>
                  {item.name} <span className="text-xs text-gray-400">({item.quantities.join(', ')})</span>
                </span>
              </label>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}
